services:
  processor:
    build:
      context: .
      dockerfile: processor/Dockerfile
    depends_on:
      topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      RAW_TOPIC: events.raw
      ENRICHED_TOPIC: events.enriched
      ALERT_TOPIC: alerts
      PROCESSOR_GROUP_ID: netra-processor
      RULES_DIR: /app/rules/sigma
      SCORER: dummy
      LOG_LEVEL: INFO
    restart: unless-stopped
