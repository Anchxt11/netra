worker_processes 1;
events { worker_connections 1024; }

http {
  # One JSON object per request. $msec = epoch seconds with ms precision.
  log_format netra escape=json
    '{"ts":"$msec","ip":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"rt":$request_time,"ua":"$http_user_agent","host":"$host",'
    '"req_body":"$request_body"}';

  # No buffer= option: buffering would delay events and inflate freshness numbers.
  access_log /var/log/nginx/netra.json netra;
  access_log /dev/stdout netra;            # so `docker compose logs nginx` works

  server {
    listen 80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
      proxy_pass http://juice-shop:3000;
    }

    # Log the body only on the login endpoint (needed for suspicious_login).
    location = /rest/user/login {
      client_body_buffer_size 8k;           # body must fit in memory to be logged
      proxy_pass http://juice-shop:3000;
    }
  }
}
